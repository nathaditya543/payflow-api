spring.application.name=payflow-api

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:payflowdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let Hibernate create/drop the schema from the entities on each run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# "USER" is a reserved word in H2 - quote identifiers so the User entity can
# still map to a table literally named USER instead of being renamed.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
